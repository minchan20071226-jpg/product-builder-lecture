<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Number Generator</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <h1>로또 번호 추첨기</h1>
    <div class="controls">
      <button id="draw-btn">추첨하기</button>
      <button id="clear-btn">초기화</button>
    </div>
    <div id="result-container">
      <!-- 로또 번호 세트가 여기에 추가됩니다 -->
    </div>

    <hr class="divider">

    <div class="contact-section">
      <h2>제휴 문의</h2>
      <form action="https://formspree.io/f/xjglrabg" method="POST" id="contact-form">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" required placeholder="이름을 입력하세요">
        </div>
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="_replyto" required placeholder="example@domain.com">
        </div>
        <div class="form-group">
          <label for="subject">문의 주제</label>
          <input type="text" id="subject" name="subject" required placeholder="문의 주제를 입력하세요">
        </div>
        <div class="form-group">
          <label for="message">문의 내용</label>
          <textarea id="message" name="message" required placeholder="내용을 입력하세요" rows="5"></textarea>
        </div>
        <button type="submit" class="submit-btn">문의하기</button>
      </form>
    </div>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
